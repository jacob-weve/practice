repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy app'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: web-format
        name: web prettier
        entry: bash -c 'cd web && pnpm format:check'
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-lint
        name: web lint
        entry: bash -c 'cd web && pnpm lint'
        language: system
        files: ^web/
        pass_filenames: false
