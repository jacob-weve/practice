name: talksoft

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talksoft
      POSTGRES_PASSWORD: talksoft
      POSTGRES_DB: talksoft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talksoft"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://talksoft:talksoft@postgres:5432/talksoft
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
