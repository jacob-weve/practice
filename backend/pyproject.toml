[project]
name = "talksoft-backend"
version = "0.1.0"
description = "TalkSoft (말랑톡) API server"
readme = "README.md"
authors = [
    { name = "jacob", email = "jacob@wevesolutions.co.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.26",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls the real LLM API (opt-in, costs money)"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async는 greenlet으로 실행 흐름을 바꾸므로 함께 추적해야 커버리지가 정확하다.
concurrency = ["greenlet", "thread"]
